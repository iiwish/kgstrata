<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kgstrata · custom plugin</title>
    <style>
      html, body { height: 100%; margin: 0; background: #070a13; color: #e7ebf3; font: 14px/1.5 system-ui, sans-serif; }

      #app { position: fixed; inset: 0; }

  </head>
  <body>
    <div id="app"></div>
    <div id="types" style="position: fixed; left: 16px; top: 16px; display: flex; gap: 6px"></div>

  </body>
