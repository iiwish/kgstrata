name: Release

# 推一个 v* 的标签（比如 v0.1.0）就发布到 npm，发布成功后建对应的 GitHub Release（正文取 CHANGELOG.md 里这个版本的那一节）。
# 标签要和 package.json 的 version 一致。建 Release 用的是工作流自带的 GITHUB_TOKEN（要 contents: write）。
#
# 发到 npm 的凭据，pnpm publish 按顺序试：
# 1. 受信发布（OIDC，不用存令牌）：在 npmjs.com 上这个包的 Settings → Trusted publishing 里加 GitHub Actions，
#    仓库 iiwish/kgstrata、工作流文件 release.yml。下面的 id-token: write 就是给它的。
# 2. 没配受信发布时退回 NPM_TOKEN（仓库 Settings → Secrets 里的 Automation 或 Granular token），日志里会有一行
#    "Skipped OIDC"。配好受信发布、发过一版确认能用以后，就可以删掉这个 secret 和下面的 NODE_AUTH_TOKEN。
on:
  push:
    tags: ['v*']

permissions:
  # 建 GitHub Release 要写权限
  contents: write
  # npm 的 provenance：证明这个包是从这个仓库、这次构建发出去的
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: 标签和版本号一致
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 和 package.json 的版本 $version 对不上"
            exit 1
          fi
      # 先把这个版本在 CHANGELOG 里的那一节取出来：没有这一节就不发（发布前就该写好）
      - name: 取 CHANGELOG 里这个版本的那一节
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md 里没有 ## [$version] 这一节（或者是空的）"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      # prepublishOnly 会再跑一遍 pnpm build 和 pnpm check:pack
      - run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # 发布成功了才建 Release；标签已经在了，gh 直接用它
      - name: 建 GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
